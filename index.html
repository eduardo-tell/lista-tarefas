<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=BioRhyme&family=Space+Mono&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />

    <style>
        :root {
            /* --- Sobrescrevendo variáveis nativas do Bootstrap --- */
            --bs-primary: #29A29D;
            --bs-primary-rgb: 41, 162, 157;
            --bs-secondary: #A3F7BF;

            /* --- Variáveis próprias do projeto --- */
            --tertiary: #A3F7BF;
            --default: #FCFCFC;
        }

        .container {
            max-width: 740px !important;
        }

        /* --- Background --- */
        .bg-primary { background-color: var(--bs-primary) !important; }
        .bg-secundary { background-color: var(--bs-secundary) !important; }
        .bg-tertiary { background-color: var(--tertiary) !important; }
        .bg-default { background-color: var(--default) !important; }

        /* --- Texto --- */
        .text-primary { color: var(--bs-primary) !important; }
        .text-secundary { color: var(--bs-secundary) !important; }
        .text-tertiary { color: var(--tertiary) !important; }
        .text-default { color: var(--default) !important; }

        .text-primary-hover:hover { color: var(--bs-primary) !important; }
        .text-secundary-hover:hover { color: var(--bs-secundary) !important; }
        .text-tertiary-hover:hover { color: var(--tertiary) !important; }
        .text-default-hover:hover { color: var(--default) !important; }
        .text-white-hover:hover { color: white !important; }

        /* --- Bordas --- */
        .border-primary { border-color: var(--bs-primary) !important; }
        .border-secundary { border-color: var(--bs-secundary) !important; }
        .border-tertiary { border-color: var(--tertiary) !important; }
        .border-default { border-color: var(--default) !important; }

        /* --- Background hover --- */
        .bg-primary-hover:hover { background-color: var(--bs-primary) !important; }
        .bg-secundary-hover:hover { background-color: var(--bs-secundary) !important; }
        .bg-tertiary-hover:hover { background-color: var(--tertiary) !important; }
        .bg-default-hover:hover { background-color: var(--default) !important; }

        /* --- Texto hover --- */
        .text-primary-hover:hover { color: var(--bs-primary) !important; }
        .text-secundary-hover:hover { color: var(--bs-secundary) !important; }
        .text-tertiary-hover:hover { color: var(--tertiary) !important; }
        .text-default-hover:hover { color: var(--default) !important; }

        /* --- Borda hover --- */
        .border-primary-hover:hover { border-color: var(--bs-primary) !important; }
        .border-secundary-hover:hover { border-color: var(--bs-secundary) !important; }
        .border-tertiary-hover:hover { border-color: var(--tertiary) !important; }
        .border-default-hover:hover { border-color: var(--default) !important; }

        .form-control:focus {
            box-shadow: 0 0 0 .25rem rgb(41 162 157 / 20%) !important;
        }

        .btn {
            font-weight: 500;
            border-radius: 0.64rem;
            border-width: 2px;
        }

        /*
        .card-effect {
            opacity: 0;
            animation: slideInUp 1s ease-out 0.2s both;
            animation-delay: var(--delay, 0s);
        }
        */

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
  </head>
  <body>
    <header class="bg-primary text-white py-4 mb-4 shadow-sm">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="mb-0">Tarefas</h1>
                </div>
                <div class="col-md-6">
                    <div class="row text-center">
                        <div class="col-4">
                            <div class="bg-secundary bg-opacity-10 rounded p-2">
                                <div class="h4 mb-0 text-black" id="totalTasks">0</div>
                                <small class="text-black">Todas</small>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="bg-secundary bg-opacity-10 rounded p-2">
                                <div class="h4 mb-0 text-black" id="completedTasks">0</div>
                                <small class="text-black">Completadas</small>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="bg-secundary bg-opacity-10 rounded p-2">
                                <div class="h4 mb-0 text-black" id="pendingTasks">0</div>
                                <small class="text-black">Pedentes</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="d-flex justify-content-end align-items-center mb-3">
                <div class="flex" id="filter-list" data-filter-list role="group">
                    <button type="button" class="btn border-primary text-primary bg-primary-hover text-white-hover" id="filterPending">Pendentes</button>
                    <button type="button" class="btn border-primary text-primary bg-primary-hover text-white-hover" id="filterCompleted">Completadas</button>
                </div>
            </div>

            <form id="taskForm" class="mb-3">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="taskTitle" class="form-label">Título</label>
                        <basic-input
                            type="text"
                            class="title-task" 
                            placeholder="Título da tarefa"
                        ></basic-input>
                    </div>
                    <div class="col-md-4">
                        <label for="taskDate" class="form-label">Data</label>
                        <basic-input
                            type="datetime-local"
                            class="date-task" 
                            placeholder="adiciona"
                        ></basic-input>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <basic-button
                            title="Adicionar" 
                            action="nova-tarefa"
                            class="w-100"
                        ></basic-button>
                    </div>
                </div>
            </form>
            
            <div data-list>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.0/moment.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
