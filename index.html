<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=BioRhyme&family=Space+Mono&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="stylesheet" href="./bootstrap.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="bg-primary py-4 mb-4 shadow-sm">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="mb-0 text-white">Tarefas</h1>
                </div>
                <div class="col-md-6">
                    <div class="row text-center">
                        <div class="col-4">
                            <div class="bg-secondary bg-opacity-10 rounded p-2">
                                <div class="h4 mb-0" id="totalTasks">0</div>
                                <small>Todas</small>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="bg-secondary bg-opacity-10 rounded p-2">
                                <div class="h4 mb-0" id="completedTasks">0</div>
                                <small>Completadas</small>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="bg-secondary bg-opacity-10 rounded p-2">
                                <div class="h4 mb-0" id="pendingTasks">0</div>
                                <small>Pedentes</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="d-flex justify-content-end align-items-center mb-3">
                <div class="d-flex gap-2" id="filter-list" data-filter-list role="group">
                    <basic-button
                        title="Pendentes" 
                        id="filterPending"
                        variant="outline"
                    ></basic-button>

                    <basic-button
                        title="Completadas" 
                        id="filterCompleted"
                        variant="outline"
                    ></basic-button>
                </div>
            </div>

            <form id="taskForm" class="mb-3" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="taskTitle" class="form-label fw-medium">Título</label>
                        <basic-input
                            type="text"
                            id="title-task" 
                            placeholder="Título da tarefa"
                        ></basic-input>
                    </div>
                    <div class="col-md-4">
                        <label for="taskDate" class="form-label fw-medium">Data</label>
                        <basic-input
                            type="date"
                            id="dateTask"
                            placeholder="adiciona"
                        ></basic-input>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <basic-button
                            title="Adicionar" 
                            action="nova-tarefa"
                            class="w-100"
                        ></basic-button>
                    </div>
                </div>
            </form>
            
            <div data-list>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.0/moment.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
