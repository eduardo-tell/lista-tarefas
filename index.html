<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- Caracteres UTF-8 para acentos do português. -->
    <meta charset="UTF-8" />
    <!-- Viewport para o layout fluir em celular sem zoom estranho. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título da aba: necessário para leitores de tela e para o histórico. -->
    <title>Lista de tarefas</title>
    <!-- Descrição curta para buscadores e para tecnologias assistivas. -->
    <meta name="description" content="Lista de tarefas com persistência local, filtros e agrupamento por data." />
    <!-- Bootstrap 5.3.8 exatamente o mesmo arquivo do projeto original. -->
    <link rel="stylesheet" href="./css/bootstrap.css" />
    <!-- Tokens, layout novo e regras de acessibilidade do app. -->
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Região viva oculta: anuncia mudanças para quem usa leitor de tela. -->
    <div id="anuncios" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <!-- Primeiro foco do teclado: pula o cabeçalho e vai ao conteúdo. -->
    <a class="skip-link visually-hidden-focusable" href="#conteudo">Pular para o conteúdo</a>

    <div class="container page-wrap py-0 py-md-5 px-0 px-md-3">
      <!-- Landmark de cabeçalho: título da página e contadores. -->
      <header>
        <app-header></app-header>
      </header>

      <!-- Landmark principal: formulário, filtros e lista. -->
      <main id="conteudo" class="mt-2 mt-md-4 d-flex flex-column gap-2 gap-md-4" tabindex="-1">
        <!-- Cadastro de novas tarefas. -->
        <app-task-form></app-task-form>

        <!-- Filtros Todas / Pendentes / Concluídas. -->
        <app-task-filters></app-task-filters>

        <!-- Lista agrupada por data (ou estado vazio). -->
        <app-task-list></app-task-list>
      </main>
    </div>

    <!-- Diálogo modal de exclusão, fora do main para não aninhar landmarks. -->
    <app-confirm-dialog></app-confirm-dialog>

    <!-- Módulos ES: o navegador carrega main.js, que registra os componentes. -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
